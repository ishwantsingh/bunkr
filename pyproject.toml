[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bunkr"
version = "0.1.0"
description = "Off-grid text, voice and recipient-directed image delivery"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13", "pillow-heif>=1.1,<2"]

[project.optional-dependencies]
meshtastic = ["meshtastic==2.7.11"]

[project.scripts]
bunkr-demo = "bunkr.demo:main"
bunkr-meshtastic-demo = "bunkr.meshtastic_transport:main"
bunkr-ui = "bunkr.ui_server:main"

[tool.setuptools.packages.find]
include = ["bunkr*"]

[tool.setuptools.package-data]
bunkr = ["ui/*.html", "ui/*.css", "ui/*.mjs", "ui/mesh/*.mjs", "ui/mesh/*.css", "ui/fonts/*.ttf", "ui/fonts/*-OFL.txt", "ui/client/*.html", "ui/client/*.svg", "ui/client/assets/*.js", "ui/client/assets/*.css"]
