[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imageoverbt"
version = "0.1.0"
description = "Off-grid text, voice and recipient-directed image delivery"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13", "pillow-heif>=1.1,<2"]

[project.optional-dependencies]
meshtastic = ["meshtastic==2.7.11"]

[project.scripts]
imageoverbt-demo = "imageoverbt.demo:main"
imageoverbt-meshtastic-demo = "imageoverbt.meshtastic_transport:main"
imageoverbt-ui = "imageoverbt.ui_server:main"

[tool.setuptools.packages.find]
include = ["imageoverbt*"]

[tool.setuptools.package-data]
imageoverbt = ["ui/*.html", "ui/*.css", "ui/*.mjs", "ui/mesh/*.mjs", "ui/mesh/*.css", "ui/fonts/*.ttf", "ui/fonts/*-OFL.txt"]
