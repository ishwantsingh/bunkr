name: Media contract and recovery
on: [push, pull_request]
jobs:
  media:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[meshtastic]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/ui/*.test.mjs mesh-ui/simulator.test.mjs
      - run: python -m imageoverbt.demo
      - run: python -m imageoverbt.meshtastic_transport
      - uses: actions/upload-artifact@v4
        with:
          name: media-demo-${{ matrix.python-version }}
          path: demo-output/
